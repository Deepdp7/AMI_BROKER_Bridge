[package]
name = "app"
version = "0.1.0"
description = "DataBridge Pro"
authors = ["DataBridge Pro"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.4.0"

# Windows 11 Snap Layouts on the custom maximize button (see src/window_chrome.rs)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  # DPAPI + random bytes for the credential key (see src/secret_key.rs)
  "Win32_Security_Cryptography",
  # Start with Windows entry (src/autostart.rs) and AmiBroker install records (src/amibroker.rs)
  "Win32_System_Registry",
  # Finding and focusing AmiBroker (see src/amibroker.rs)
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }
# WebView2 settings Tauri doesn't expose: no browser menu or shortcut keys (see src/window_chrome.rs).
# Same version wry uses, so the types match.
webview2-com = "0.38"
